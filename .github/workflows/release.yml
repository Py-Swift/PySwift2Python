name: Release

# Triggered automatically on version tag push — builds per-arch binaries and
# attaches them to the GitHub release.
# Can also be triggered manually to do a dry-run build without publishing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only (no release upload)'
        required: false
        default: 'true'
        type: boolean

jobs:
  # Build natively on each architecture.
  # (arch -x86_64 on a macos-15 runner cross-runs Rosetta for x86_64.)
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: x86_64
            build_cmd: arch -x86_64 swift build -c release --product pyswift2python
          - os: macos-15
            arch: arm64
            build_cmd: swift build -c release --product pyswift2python

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.arch }} release binary
        run: ${{ matrix.build_cmd }}

      - name: Locate and stage binary
        run: |
          BIN=$(swift build -c release --product pyswift2python --show-bin-path 2>/dev/null || \
                find .build -name "pyswift2python" -type f -perm +111 | head -1)
          # Fallback: find directly when show-bin-path returns the wrong arch after Rosetta
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            BIN=$(find .build -path "*x86_64*" -name "pyswift2python" -type f -perm +111 | head -1)
          else
            BIN=$(find .build -path "*arm64*" -name "pyswift2python" -type f -perm +111 | head -1)
          fi
          echo "Found binary at: $BIN"
          cp "$BIN" pyswift2python-${{ matrix.arch }}-apple-macosx
          file pyswift2python-${{ matrix.arch }}-apple-macosx

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: pyswift2python-${{ matrix.arch }}-apple-macosx

  # Attach both per-arch binaries to the GitHub release.
  release:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write   # needed to upload release assets

    steps:
      - uses: actions/checkout@v4

      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: binary-x86_64
          path: /tmp/x86_64

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: binary-arm64
          path: /tmp/arm64

      - name: Prepare release assets
        run: |
          chmod +x /tmp/x86_64/pyswift2python-x86_64-apple-macosx \
                   /tmp/arm64/pyswift2python-arm64-apple-macosx

          # Print arch info for the release summary
          echo "## Release binaries" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          file /tmp/x86_64/pyswift2python-x86_64-apple-macosx >> "$GITHUB_STEP_SUMMARY"
          file /tmp/arm64/pyswift2python-arm64-apple-macosx   >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          VERSION="${{ github.ref_name }}"
          echo "## Usage in pyswiftkit-builder" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Copy the binaries into \`pyswiftkit-builder/src/pyswiftkit_builder/bin/\`:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "curl -L https://github.com/Py-Swift/PySwift2Python/releases/download/${VERSION}/pyswift2python-x86_64-apple-macosx \\" >> "$GITHUB_STEP_SUMMARY"
          echo "     -o pyswiftkit-builder/src/pyswiftkit_builder/bin/pyswift2python-x86_64-apple-macosx" >> "$GITHUB_STEP_SUMMARY"
          echo "curl -L https://github.com/Py-Swift/PySwift2Python/releases/download/${VERSION}/pyswift2python-arm64-apple-macosx \\" >> "$GITHUB_STEP_SUMMARY"
          echo "     -o pyswiftkit-builder/src/pyswiftkit_builder/bin/pyswift2python-arm64-apple-macosx" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload binaries to release
        # Only upload on real tag pushes, not manual dry runs.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/x86_64/pyswift2python-x86_64-apple-macosx
            /tmp/arm64/pyswift2python-arm64-apple-macosx
          fail_on_unmatched_files: true
